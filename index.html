    <script>
      // đặt theme trước khi render để khỏi nháy màu
      try {
        var t = localStorage.getItem('theme')
        document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      } catch (e) {}
    </script>
